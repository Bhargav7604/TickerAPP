
version: 0.0
os: linux

files:
  - source: compose.ec2.yaml
    destination: /opt/tickerapp
  - source: backend/
    destination: /opt/tickerapp/backend
  - source: docker/
    destination: /opt/tickerapp/docker
  - source: frontend/
    destination: /opt/tickerapp/frontend
  - source: webapp/
    destination: /opt/tickerapp/webapp
  - source: templates/
    destination: /opt/tickerapp/templates
  - source: manage.py
    destination: /opt/tickerapp
  - source: requirements.txt
    destination: /opt/tickerapp
  - source: master_contract.csv
    destination: /opt/tickerapp

hooks:
  BeforeInstall:
    - location: deploy/scripts/bootstrap-runtime.sh
      timeout: 600
      runas: root

  AfterInstall:
    - location: deploy/scripts/refresh_images.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: deploy/scripts/start_stack.sh
      timeout: 600
      runas: root

  ValidateService:
    - location: deploy/scripts/healthcheck.sh
      timeout: 60
      runas: root
