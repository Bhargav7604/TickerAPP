
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/tickerapp

file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: deploy/scripts/bootstrap-runtime.sh
      timeout: 600
      runas: root

  AfterInstall:
    - location: deploy/scripts/refresh_images.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: deploy/scripts/start_stack.sh
      timeout: 600
      runas: root

  ValidateService:
    - location: deploy/scripts/healthcheck.sh
      timeout: 60
      runas: root
