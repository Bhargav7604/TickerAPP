version: 0.2

env:
  variables:
    IMAGE_TAG: ""
    ECR_REGISTRY: "921829859169.dkr.ecr.ap-south-1.amazonaws.com"
    ECR_REPOSITORY: "ticker-repo"
    AWS_DEFAULT_REGION: "ap-south-1"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade awscli
      - timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

  pre_build:
    commands:
      - set -e
      - |
        if [ -z "$IMAGE_TAG" ]; then
          if [ -n "$CODEBUILD_RESOLVED_SOURCE_VERSION" ]; then
            IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
          else
            IMAGE_TAG=latest
          fi
        fi
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - echo "ECR_REGISTRY=$ECR_REGISTRY"
      - echo "ECR_REPOSITORY=$ECR_REPOSITORY"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - set -e
      - docker build -f docker/backend/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG" .
      - docker build -f docker/frontend/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG" .
      - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG"
      - printf '[{"name":"backend","imageUri":"%s/%s:backend-%s"},{"name":"frontend","imageUri":"%s/%s:frontend-%s"}]\n' "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
